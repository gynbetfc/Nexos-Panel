name: Build NEXOS APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf libtool libffi-dev libltdl-dev
          pip install buildozer==1.5.0 cython
      
      - name: Create project
        run: |
          mkdir -p apk-build/agent
          cp device_agent.py apk-build/agent/main.py
          cd apk-build
          buildozer init
      
      - name: Configure buildozer
        run: |
          cat > apk-build/buildozer.spec << 'SPECEOF'
          [app]
          title = NEXOS
          package.name = nexosagent
          package.domain = org.nexos
          source.dir = agent
          source.include_exts = py
          version = 1.0
          requirements = python3,kivy,requests
          orientation = portrait
          fullscreen = 1
          android.permissions = INTERNET,ACCESS_FINE_LOCATION,ACCESS_COARSE_LOCATION,CAMERA
          android.api = 30
          android.minapi = 21
          android.ndk = 23c
          android.archs = arm64-v8a
          android.allow_backup = True
          android.presplash_color = #000000
          android.accept_sdk_license = True
          p4a.branch = master
          [buildozer]
          log_level = 2
          warn_on_root = 1
          SPECEOF
      
      - name: Build APK
        run: |
          cd apk-build
          buildozer android debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXOS-APK
          path: apk-build/bin/*.apk
